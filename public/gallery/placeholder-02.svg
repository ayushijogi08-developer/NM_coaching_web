<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <radialGradient id="p2_bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4B237F" />
      <stop offset="60%" stop-color="#2E1352" />
      <stop offset="100%" stop-color="#1B0A30" />
    </radialGradient>
    <linearGradient id="p2_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6B93B" />
      <stop offset="100%" stop-color="#F28C28" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p2_bg)" />

  <!-- Background Orbit Circles -->
  <circle cx="400" cy="310" r="230" stroke="#F6B93B" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />
  <circle cx="400" cy="310" r="170" stroke="#F28C28" stroke-width="2" opacity="0.3" />

  <!-- Central Study Table -->
  <circle cx="400" cy="310" r="115" fill="#3F1F6B" stroke="#6B3FA0" stroke-width="5" />

  <!-- Open Notebooks on Table -->
  <rect x="355" y="255" width="40" height="28" rx="3" fill="#FFFFFF" />
  <rect x="395" y="255" width="40" height="28" rx="3" fill="#F5F0FA" />
  <line x1="395" y1="255" x2="395" y2="283" stroke="#6B3FA0" stroke-width="2" />

  <rect x="325" y="310" width="35" height="25" rx="3" fill="#F6B93B" transform="rotate(-20 325 310)" />
  <rect x="435" y="320" width="40" height="25" rx="3" fill="#F28C28" transform="rotate(25 435 320)" />

  <!-- Idea Spark / Light in Center -->
  <circle cx="400" cy="310" r="16" fill="url(#p2_gold)" />
  <polygon points="400,280 404,302 420,306 404,310 400,330 396,310 380,306 396,302" fill="#FFFFFF" opacity="0.95" />

  <!-- Student Avatars Around Table -->
  <!-- Student Top -->
  <g transform="translate(400, 130)">
    <circle cx="0" cy="0" r="32" fill="#F28C28" />
    <circle cx="0" cy="-6" r="14" fill="#FFFFFF" opacity="0.9" />
    <path d="M -22 24 C -20 6, 20 6, 22 24 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Student Bottom-Left -->
  <g transform="translate(240, 420)">
    <circle cx="0" cy="0" r="32" fill="#6B3FA0" />
    <circle cx="0" cy="-6" r="14" fill="#FFFFFF" opacity="0.9" />
    <path d="M -22 24 C -20 6, 20 6, 22 24 Z" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Student Bottom-Right -->
  <g transform="translate(560, 420)">
    <circle cx="0" cy="0" r="32" fill="#F6B93B" />
    <circle cx="0" cy="-6" r="14" fill="#2A1744" opacity="0.9" />
    <path d="M -22 24 C -20 6, 20 6, 22 24 Z" fill="#2A1744" opacity="0.9" />
  </g>

  <!-- Dispersing Knowledge Pixels -->
  <rect x="130" y="160" width="16" height="16" rx="3" fill="#F6B93B" opacity="0.8" />
  <rect x="200" y="240" width="12" height="12" rx="2" fill="#F28C28" opacity="0.75" />
  <rect x="110" y="360" width="14" height="14" rx="3" fill="#FFFFFF" opacity="0.7" />
  <rect x="190" y="470" width="14" height="14" rx="3" fill="#F28C28" opacity="0.8" />
  
  <rect x="660" y="150" width="16" height="16" rx="3" fill="#F28C28" opacity="0.8" />
  <rect x="600" y="240" width="12" height="12" rx="2" fill="#FFFFFF" opacity="0.75" />
  <rect x="680" y="350" width="14" height="14" rx="3" fill="#F6B93B" opacity="0.8" />
  <rect x="610" y="480" width="12" height="12" rx="2" fill="#F6B93B" opacity="0.75" />

  <!-- Label Badge -->
  <g transform="translate(300, 32)">
    <rect width="200" height="34" rx="17" fill="#F6B93B" fill-opacity="0.2" stroke="#F6B93B" stroke-width="1.5" />
    <text x="100" y="22" font-family="sans-serif" font-weight="700" font-size="12" fill="#F6B93B" text-anchor="middle" letter-spacing="1">STUDY GROUP</text>
  </g>
</svg>