<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="p5_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F1F6B" />
      <stop offset="60%" stop-color="#281345" />
      <stop offset="100%" stop-color="#180A2C" />
    </linearGradient>
    <linearGradient id="p5_lamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6B93B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F6B93B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p5_bg)" />

  <!-- Cone of Light from Reading Lamp -->
  <polygon points="620,160 300,520 740,520" fill="url(#p5_lamp)" />

  <!-- Study Desk Surface -->
  <rect x="100" y="440" width="600" height="90" rx="10" fill="#2E1552" stroke="#6B3FA0" stroke-width="4" />
  <rect x="140" y="530" width="16" height="50" fill="#1A0A2E" />
  <rect x="644" y="530" width="16" height="50" fill="#1A0A2E" />

  <!-- Modern Desk Lamp -->
  <g transform="translate(620, 200)">
    <circle cx="0" cy="240" r="30" fill="#F28C28" />
    <path d="M 0 240 L 0 60 L -40 -20" stroke="#F28C28" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Lamp head -->
    <path d="M -60 -45 L -20 -5 L -5 -25 Z" fill="#F6B93B" stroke="#FFA64D" stroke-width="2" />
    <circle cx="-25" cy="-20" r="10" fill="#FFFFFF" />
  </g>

  <!-- Large Open Spiral Notebook -->
  <g transform="translate(260, 360)">
    <rect x="0" y="0" width="130" height="100" rx="4" fill="#FFFFFF" stroke="#E2D9F3" stroke-width="2" />
    <rect x="130" y="0" width="130" height="100" rx="4" fill="#F5F0FA" stroke="#E2D9F3" stroke-width="2" />
    
    <!-- Spiral binder rings -->
    <circle cx="130" cy="15" r="4" fill="#6B3FA0" />
    <circle cx="130" cy="35" r="4" fill="#6B3FA0" />
    <circle cx="130" cy="55" r="4" fill="#6B3FA0" />
    <circle cx="130" cy="75" r="4" fill="#6B3FA0" />
    <circle cx="130" cy="95" r="4" fill="#6B3FA0" />

    <!-- Ruled text lines -->
    <line x1="20" y1="25" x2="110" y2="25" stroke="#6B3FA0" stroke-width="2" opacity="0.3" />
    <line x1="20" y1="45" x2="110" y2="45" stroke="#6B3FA0" stroke-width="2" opacity="0.3" />
    <line x1="20" y1="65" x2="90" y2="65" stroke="#6B3FA0" stroke-width="2" opacity="0.3" />
    
    <line x1="150" y1="25" x2="240" y2="25" stroke="#F28C28" stroke-width="2" opacity="0.4" />
    <line x1="150" y1="45" x2="230" y2="45" stroke="#6B3FA0" stroke-width="2" opacity="0.3" />
    <line x1="150" y1="65" x2="210" y2="65" stroke="#6B3FA0" stroke-width="2" opacity="0.3" />

    <!-- Highlighter Pen lying beside -->
    <rect x="70" y="110" width="80" height="10" rx="3" fill="#F6B93B" transform="rotate(-5 70 110)" />
  </g>

  <!-- Cup of Stationery -->
  <rect x="180" y="390" width="40" height="55" rx="5" fill="#6B3FA0" />
  <line x1="190" y1="365" x2="190" y2="390" stroke="#F6B93B" stroke-width="4" stroke-linecap="round" />
  <line x1="202" y1="355" x2="202" y2="390" stroke="#F28C28" stroke-width="4" stroke-linecap="round" />
  <line x1="214" y1="370" x2="214" y2="390" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Dispersing Pixels -->
  <rect x="120" y="220" width="16" height="16" rx="3" fill="#F6B93B" opacity="0.8" />
  <rect x="150" y="180" width="12" height="12" rx="2" fill="#F28C28" opacity="0.75" />
  <rect x="420" y="240" width="14" height="14" rx="3" fill="#FFFFFF" opacity="0.8" />
  <rect x="450" y="200" width="18" height="18" rx="4" fill="#F6B93B" opacity="0.9" />

  <!-- Label Badge -->
  <g transform="translate(290, 30)">
    <rect width="220" height="36" rx="18" fill="#F6B93B" fill-opacity="0.2" stroke="#F6B93B" stroke-width="1.5" />
    <text x="110" y="23" font-family="sans-serif" font-weight="700" font-size="13" fill="#F6B93B" text-anchor="middle" letter-spacing="1">READING CORNER</text>
  </g>
</svg>
