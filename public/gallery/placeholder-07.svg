<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="p7_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F1F6B" />
      <stop offset="60%" stop-color="#2B1449" />
      <stop offset="100%" stop-color="#19082D" />
    </linearGradient>
    <linearGradient id="p7_badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#F6B93B" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p7_bg)" />

  <!-- Radiance Background Ring -->
  <circle cx="400" cy="320" r="230" stroke="#F6B93B" stroke-width="1.5" stroke-dasharray="6 12" opacity="0.25" />

  <!-- Exam Answer Sheet (Crisp White Card with score A+) -->
  <g transform="translate(240, 160)">
    <!-- Shadow & Paper -->
    <rect x="-10" y="10" width="320" height="380" rx="12" fill="#1B0C2E" opacity="0.6" />
    <rect x="0" y="0" width="320" height="380" rx="12" fill="#FFFFFF" stroke="#E2D9F3" stroke-width="3" />

    <!-- Exam Paper Header -->
    <rect x="25" y="25" width="160" height="12" rx="3" fill="#6B3FA0" />
    <rect x="25" y="45" width="110" height="8" rx="2" fill="#F28C28" />
    
    <!-- Big 'A+' Score Stamp in Red/Orange -->
    <g transform="translate(250, 45)">
      <circle cx="0" cy="0" r="30" fill="none" stroke="#EF4444" stroke-width="3.5" stroke-dasharray="4 2" />
      <text x="0" y="10" font-family="sans-serif" font-weight="900" font-size="28" fill="#EF4444" text-anchor="middle">A+</text>
    </g>

    <!-- Ruled Answer Lines with Checkmarks -->
    <line x1="25" y1="90" x2="295" y2="90" stroke="#6B3FA0" stroke-width="1.5" opacity="0.2" />
    <line x1="25" y1="115" x2="240" y2="115" stroke="#6B3FA0" stroke-width="2.5" opacity="0.5" />
    <line x1="25" y1="140" x2="270" y2="140" stroke="#6B3FA0" stroke-width="2.5" opacity="0.5" />
    <path d="M 280 135 L 285 140 L 295 128" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />

    <line x1="25" y1="175" x2="295" y2="175" stroke="#6B3FA0" stroke-width="1.5" opacity="0.2" />
    <line x1="25" y1="200" x2="250" y2="200" stroke="#6B3FA0" stroke-width="2.5" opacity="0.5" />
    <line x1="25" y1="225" x2="230" y2="225" stroke="#6B3FA0" stroke-width="2.5" opacity="0.5" />
    <path d="M 280 220 L 285 225 L 295 213" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />

    <line x1="25" y1="260" x2="295" y2="260" stroke="#6B3FA0" stroke-width="1.5" opacity="0.2" />
    <line x1="25" y1="285" x2="260" y2="285" stroke="#6B3FA0" stroke-width="2.5" opacity="0.5" />
    <path d="M 280 280 L 285 285 L 295 273" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Stopwatch / Timer Graphic (Disciplined Time Management) -->
  <g transform="translate(160, 380)">
    <circle cx="0" cy="0" r="50" fill="#3F1F6B" stroke="#F6B93B" stroke-width="5" />
    <circle cx="0" cy="0" r="42" fill="#2A1744" />
    <!-- Dial marks -->
    <line x1="0" y1="-38" x2="0" y2="-30" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="38" y1="0" x2="30" y2="0" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="0" y1="38" x2="0" y2="30" stroke="#FFFFFF" stroke-width="2.5" />
    <line x1="-38" y1="0" x2="-30" y2="0" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Clock Hands -->
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#F28C28" stroke-width="3.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="16" y2="0" stroke="#F6B93B" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    <!-- Top button -->
    <rect x="-8" y="-60" width="16" height="10" rx="2" fill="#F6B93B" />
  </g>

  <!-- Wooden Ruler & Sharp Pencil -->
  <g transform="translate(580, 360) rotate(15)">
    <!-- Ruler -->
    <rect x="-20" y="-120" width="40" height="240" rx="4" fill="#F6B93B" stroke="#E0A026" stroke-width="2" />
    <line x1="0" y1="-100" x2="20" y2="-100" stroke="#3F1F6B" stroke-width="2" />
    <line x1="8" y1="-80" x2="20" y2="-80" stroke="#3F1F6B" stroke-width="1.5" />
    <line x1="0" y1="-60" x2="20" y2="-60" stroke="#3F1F6B" stroke-width="2" />
    <line x1="8" y1="-40" x2="20" y2="-40" stroke="#3F1F6B" stroke-width="1.5" />
    <line x1="0" y1="-20" x2="20" y2="-20" stroke="#3F1F6B" stroke-width="2" />
    <line x1="8" y1="0" x2="20" y2="0" stroke="#3F1F6B" stroke-width="1.5" />
    <line x1="0" y1="20" x2="20" y2="20" stroke="#3F1F6B" stroke-width="2" />
  </g>

  <!-- Floating Pixels -->
  <rect x="100" y="200" width="16" height="16" rx="3" fill="#F28C28" opacity="0.8" />
  <rect x="130" y="160" width="12" height="12" rx="2" fill="#F6B93B" opacity="0.75" />
  <rect x="670" y="220" width="18" height="18" rx="4" fill="#F6B93B" opacity="0.9" />
  <rect x="700" y="260" width="14" height="14" rx="3" fill="#F28C28" opacity="0.8" />

  <!-- Label Badge -->
  <g transform="translate(280, 30)">
    <rect width="240" height="36" rx="18" fill="#F28C28" fill-opacity="0.2" stroke="#F28C28" stroke-width="1.5" />
    <text x="120" y="23" font-family="sans-serif" font-weight="700" font-size="13" fill="#F6B93B" text-anchor="middle" letter-spacing="1">BOARD EXAM PREP</text>
  </g>
</svg>
