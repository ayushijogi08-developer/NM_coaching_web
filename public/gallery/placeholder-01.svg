<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="p1_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F1F6B" />
      <stop offset="60%" stop-color="#2A1744" />
      <stop offset="100%" stop-color="#1B0C2E" />
    </linearGradient>
    <linearGradient id="p1_board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1035" />
      <stop offset="100%" stop-color="#2D174C" />
    </linearGradient>
    <linearGradient id="p1_orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F28C28" />
      <stop offset="100%" stop-color="#F6B93B" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#p1_bg)" />

  <!-- Wall Grid Accent -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Classroom Blackboard -->
  <rect x="140" y="80" width="520" height="280" rx="16" fill="url(#p1_board)" stroke="#6B3FA0" stroke-width="8" />
  <rect x="156" y="96" width="488" height="248" rx="8" stroke="#F6B93B" stroke-width="2" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Blackboard Content: Math & Science Formulas -->
  <text x="180" y="145" font-family="sans-serif" font-weight="700" font-size="22" fill="#F6B93B">Ninamore Knowledge Academy</text>
  <text x="180" y="180" font-family="monospace" font-size="16" fill="#F5F0FA" opacity="0.8">ΔABC : a² + b² = c²</text>
  <path d="M 180 260 L 260 260 L 260 200 Z" stroke="#F28C28" stroke-width="3" fill="#F28C28" fill-opacity="0.15" />
  <text x="280" y="235" font-family="monospace" font-size="15" fill="#FFFFFF" opacity="0.85">E = mc² • F = ma</text>
  <text x="280" y="260" font-family="monospace" font-size="14" fill="#F6B93B">sin²θ + cos²θ = 1</text>
  
  <!-- Chalk tray & eraser -->
  <rect x="260" y="360" width="280" height="10" rx="3" fill="#6B3FA0" />
  <rect x="360" y="352" width="40" height="8" rx="2" fill="#F6B93B" />
  <rect x="420" y="354" width="25" height="6" rx="1" fill="#FFFFFF" />

  <!-- Student Classroom Desks -->
  <!-- Left Desk -->
  <rect x="120" y="440" width="220" height="90" rx="8" fill="#4B2480" stroke="#6B3FA0" stroke-width="3" />
  <rect x="140" y="530" width="16" height="50" fill="#2A1744" />
  <rect x="300" y="530" width="16" height="50" fill="#2A1744" />
  <rect x="150" y="415" width="55" height="25" rx="3" fill="#F28C28" />
  <rect x="220" y="410" width="45" height="30" rx="3" fill="#F6B93B" />
  <circle x="290" y="425" r="10" fill="#FFFFFF" opacity="0.8" />

  <!-- Right Desk -->
  <rect x="460" y="440" width="220" height="90" rx="8" fill="#4B2480" stroke="#6B3FA0" stroke-width="3" />
  <rect x="480" y="530" width="16" height="50" fill="#2A1744" />
  <rect x="640" y="530" width="16" height="50" fill="#2A1744" />
  <rect x="490" y="410" width="60" height="30" rx="3" fill="#F6B93B" />
  <rect x="570" y="415" width="50" height="25" rx="3" fill="#F28C28" />

  <!-- Floating Brand Pixel Particles -->
  <rect x="80" y="160" width="16" height="16" rx="3" fill="#F28C28" opacity="0.85" />
  <rect x="100" y="130" width="12" height="12" rx="2" fill="#F6B93B" opacity="0.75" />
  <rect x="690" y="170" width="18" height="18" rx="3" fill="#F6B93B" opacity="0.9" />
  <rect x="720" y="210" width="14" height="14" rx="2" fill="#F28C28" opacity="0.8" />
  <rect x="680" y="240" width="10" height="10" rx="2" fill="#FFFFFF" opacity="0.7" />

  <!-- Label Badge -->
  <g transform="translate(300, 20)">
    <rect width="200" height="36" rx="18" fill="#F28C28" fill-opacity="0.2" stroke="#F28C28" stroke-width="1.5" />
    <text x="100" y="23" font-family="sans-serif" font-weight="700" font-size="13" fill="#F6B93B" text-anchor="middle" letter-spacing="1">CLASSROOM SESSION</text>
  </g>
</svg>
