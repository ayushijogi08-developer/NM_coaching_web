<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="p6_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B237F" />
      <stop offset="60%" stop-color="#2C124E" />
      <stop offset="100%" stop-color="#19062D" />
    </linearGradient>
    <linearGradient id="p6_screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D174C" />
      <stop offset="100%" stop-color="#1B0C30" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p6_bg)" />

  <!-- Digital Tech Grid -->
  <g opacity="0.1" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="160" y1="0" x2="160" y2="600" />
    <line x1="320" y1="0" x2="320" y2="600" />
    <line x1="480" y1="0" x2="480" y2="600" />
    <line x1="640" y1="0" x2="640" y2="600" />
  </g>

  <!-- Modern Open Laptop in Center -->
  <g transform="translate(220, 180)">
    <!-- Screen Lid -->
    <rect x="0" y="0" width="360" height="225" rx="10" fill="#2A1744" stroke="#6B3FA0" stroke-width="4" />
    <rect x="14" y="14" width="332" height="197" rx="6" fill="url(#p6_screen)" />
    
    <!-- Code / Learning Dashboard on Screen -->
    <rect x="35" y="35" width="85" height="10" rx="3" fill="#F6B93B" />
    <rect x="35" y="55" width="140" height="7" rx="2" fill="#FFFFFF" opacity="0.6" />
    <rect x="35" y="69" width="105" height="7" rx="2" fill="#FFFFFF" opacity="0.4" />
    <rect x="35" y="83" width="125" height="7" rx="2" fill="#FFFFFF" opacity="0.5" />

    <!-- Bar Chart Graphic -->
    <rect x="200" y="115" width="20" height="60" rx="3" fill="#F28C28" />
    <rect x="230" y="80" width="20" height="95" rx="3" fill="#F6B93B" />
    <rect x="260" y="98" width="20" height="77" rx="3" fill="#6B3FA0" />
    <rect x="290" y="60" width="20" height="115" rx="3" fill="#10B981" />
    <line x1="190" y1="180" x2="320" y2="180" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />

    <!-- Camera Dot -->
    <circle cx="180" cy="8" r="2.5" fill="#FFFFFF" opacity="0.6" />

    <!-- Laptop Base / Keyboard deck -->
    <path d="M -35 225 L 395 225 L 420 255 L -60 255 Z" fill="#3F1F6B" stroke="#6B3FA0" stroke-width="3" />
    <!-- Trackpad -->
    <rect x="135" y="232" width="90" height="16" rx="3" fill="#2A1744" />
  </g>

  <!-- Left: Coffee Mug & Study Notes -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="38" height="48" rx="6" fill="#F28C28" />
    <path d="M -6 10 C -16 10, -16 34, -6 34" stroke="#F28C28" stroke-width="4" fill="none" />
    <!-- Steam waves -->
    <path d="M 12 -12 Q 16 -6 12 0" stroke="#F6B93B" stroke-width="2" fill="none" opacity="0.7" />
    <path d="M 24 -15 Q 28 -8 24 0" stroke="#F6B93B" stroke-width="2" fill="none" opacity="0.7" />
  </g>

  <!-- Right: Achievement Trophy & Notes -->
  <g transform="translate(660, 370)">
    <!-- Golden Trophy Cup -->
    <path d="M 10 0 L 50 0 L 44 32 C 44 48, 16 48, 16 32 Z" fill="#F6B93B" />
    <rect x="26" y="44" width="8" height="18" fill="#F28C28" />
    <rect x="16" y="62" width="28" height="10" rx="2" fill="#3F1F6B" stroke="#6B3FA0" stroke-width="2" />
    <!-- Trophy handles -->
    <path d="M 10 8 C 0 8, 0 24, 12 24" stroke="#F6B93B" stroke-width="3" fill="none" />
    <path d="M 50 8 C 60 8, 60 24, 48 24" stroke="#F6B93B" stroke-width="3" fill="none" />
    <!-- Star on Trophy -->
    <polygon points="30,12 32,18 38,18 33,22 35,28 30,24 25,28 27,22 22,18 28,18" fill="#FFFFFF" />
  </g>

  <!-- Floating Pixels Particles -->
  <rect x="90" y="140" width="16" height="16" rx="3" fill="#F6B93B" opacity="0.85" />
  <rect x="140" y="240" width="14" height="14" rx="3" fill="#F28C28" opacity="0.75" />
  <rect x="690" y="150" width="18" height="18" rx="4" fill="#F28C28" opacity="0.8" />
  <rect x="730" y="250" width="12" height="12" rx="2" fill="#FFFFFF" opacity="0.75" />

  <!-- Label Badge -->
  <g transform="translate(290, 32)">
    <rect width="220" height="34" rx="17" fill="#F28C28" fill-opacity="0.2" stroke="#F28C28" stroke-width="1.5" />
    <text x="110" y="22" font-family="sans-serif" font-weight="700" font-size="12" fill="#F6B93B" text-anchor="middle" letter-spacing="1">ACADEMIC WORKSHOP</text>
  </g>
</svg>