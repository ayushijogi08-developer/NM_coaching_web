<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" fill="none">
  <defs>
    <linearGradient id="p3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F1F6B" />
      <stop offset="50%" stop-color="#2D154B" />
      <stop offset="100%" stop-color="#1A0A2E" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#p3_bg)" />

  <!-- Podium / Stage Surface -->
  <path d="M 80 500 Q 400 460 720 500 L 720 600 L 80 600 Z" fill="#25103E" />
  <path d="M 80 500 Q 400 460 720 500" stroke="#F6B93B" stroke-width="3" opacity="0.4" />

  <!-- Stack of Hardcover Books -->
  <!-- Book 1 (Bottom Purple) -->
  <rect x="240" y="420" width="320" height="45" rx="6" fill="#6B3FA0" stroke="#8C52FF" stroke-width="2" />
  <rect x="250" y="428" width="300" height="8" rx="2" fill="#F5F0FA" opacity="0.4" />
  <rect x="235" y="420" width="20" height="45" rx="4" fill="#5A2E94" />

  <!-- Book 2 (Middle Orange) -->
  <rect x="270" y="370" width="270" height="45" rx="6" fill="#F28C28" stroke="#FFA64D" stroke-width="2" />
  <rect x="280" y="378" width="250" height="8" rx="2" fill="#FFFFFF" opacity="0.5" />
  <rect x="265" y="370" width="18" height="45" rx="4" fill="#D97416" />

  <!-- Book 3 (Top Golden Yellow) -->
  <rect x="300" y="320" width="220" height="45" rx="6" fill="#F6B93B" stroke="#FFD166" stroke-width="2" />
  <rect x="310" y="328" width="200" height="8" rx="2" fill="#FFFFFF" opacity="0.6" />
  <rect x="295" y="320" width="16" height="45" rx="4" fill="#E0A026" />

  <!-- Open Book on Top with Pages Rising into Pixels -->
  <g transform="translate(410, 240)">
    <!-- Left page -->
    <path d="M 0 40 Q -50 48 -100 35 L -100 -20 Q -50 -10 0 -20 Z" fill="#FFFFFF" />
    <line x1="-80" y1="0" x2="-20" y2="-5" stroke="#6B3FA0" stroke-width="3" opacity="0.4" />
    <line x1="-80" y1="12" x2="-30" y2="7" stroke="#6B3FA0" stroke-width="3" opacity="0.4" />
    <line x1="-80" y1="24" x2="-40" y2="19" stroke="#F28C28" stroke-width="3" opacity="0.5" />

    <!-- Right page breaking into pixels -->
    <path d="M 0 40 Q 50 48 100 35 L 100 -20 Q 50 -10 0 -20 Z" fill="#FFFFFF" />
    <line x1="20" y1="-5" x2="60" y2="0" stroke="#6B3FA0" stroke-width="3" opacity="0.4" />
    <line x1="20" y1="7" x2="70" y2="12" stroke="#6B3FA0" stroke-width="3" opacity="0.4" />

    <!-- Floating Pixels from Book -->
    <rect x="80" y="-35" width="12" height="12" rx="2" fill="#F6B93B" />
    <rect x="105" y="-20" width="10" height="10" rx="2" fill="#F28C28" />
    <rect x="95" y="5" width="14" height="14" rx="3" fill="#FFFFFF" />
    <rect x="115" y="-55" width="14" height="14" rx="3" fill="#F28C28" />
    <rect x="135" y="-40" width="10" height="10" rx="2" fill="#F6B93B" />
  </g>

  <!-- Graduation Cap Floating -->
  <g transform="translate(380, 110)">
    <polygon points="0,-25 70,0 0,25 -70,0" fill="#2A1744" stroke="#F6B93B" stroke-width="3" />
    <rect x="-30" y="10" width="60" height="22" rx="6" fill="#3F1F6B" />
    <circle cx="0" cy="0" r="4" fill="#F6B93B" />
    <line x1="0" y1="0" x2="50" y2="25" stroke="#F6B93B" stroke-width="2.5" />
    <circle cx="50" cy="25" r="4" fill="#F28C28" />
  </g>

  <!-- Label Badge -->
  <g transform="translate(290, 25)">
    <rect width="220" height="36" rx="18" fill="#F28C28" fill-opacity="0.2" stroke="#F28C28" stroke-width="1.5" />
    <text x="110" y="23" font-family="sans-serif" font-weight="700" font-size="13" fill="#F6B93B" text-anchor="middle" letter-spacing="1">ORIENTATION SESSION</text>
  </g>
</svg>
